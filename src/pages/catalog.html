<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ПУБЛІЧНА БІБЛІОТЕКА МОПСІВ — Найлапковіший Каталог</title>
    <link rel="stylesheet" href="/styles/catalog.css">
    <link rel="stylesheet" href="/styles/book.css">
    
</head>
<body>

    <header>
        <div class="logo">Мопси з штата арізона</div>
        <nav>
            <ul>
                <li><a href="index.html">Головна</a></li>
                <li><a href="catalog.html">Каталог</a></li>
                <li><a href="events.html">Події</a></li>
                <li><a href="about.html">Про нас</a></li>
                <li><a href="contacts.html">Контакти</a></li>
            </ul>
        </nav>
    </header>

    <div class="page-header">
        <h1>🐾 Електронний каталог лапкових історій 🐾</h1>
        <div class="search-box">
            <input type="text" placeholder="Введіть назву книги про мопсів або автора...">
            <select>
                <option value="">Усі лапко-категорії</option>
                <option value="prose">Солодкий сон і храп</option>
                <option value="science">Наука випрошування печива</option>
                <option value="kids">Казки для зморщених носиків</option>
                <option value="it">ІТ та кібер-мопси</option>
            </select>
            <button>Шукати 🐾</button>
        </div>
    </div>
<div class="card" style="margin-bottom: 2rem; max-width: 600px; margin-left: auto; margin-right: auto;">
    <h3 style="margin-bottom: 1rem; color: var(--primary);">Додати нову книгу</h3>
    <form id="addBookForm">
        <div style="margin-bottom: 1rem;">
            <label style="display: block; margin-bottom: 0.3rem; font-weight: 600;">Назва книги:</label>
            <input type="text" id="title" required style="width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px;">
        </div>
        <div style="margin-bottom: 1rem;">
            <label style="display: block; margin-bottom: 0.3rem; font-weight: 600;">Ціна:</label>
            <input type="number" id="price" min="0" step="0.01" required style="width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px;">
        </div>
        <div style="margin-bottom: 1rem;">
            <label style="display: block; margin-bottom: 0.3rem; font-weight: 600;">
                <input type="checkbox" id="is_active" checked>
                Книга доступна
            </label>
        </div>
        <button type="submit" style="background: var(--secondary); color: white; border: none; padding: 0.75rem 1.5rem; border-radius: 4px; cursor: pointer; width: 100%;">Додати книгу</button>
    </form>
</div>

<script>
    document.getElementById("addBookForm").addEventListener("submit", async (e) => {
        e.preventDefault();

        const bookData = {
            title: document.getElementById("title").value.trim(),
            price: Number(document.getElementById("price").value),
            is_active: document.getElementById("is_active").checked
        };

        try {
            const response = await fetch("/books", {
                method: "POST",
                headers: { "Content-Type": "application/json; charset=utf-8" },
                body: JSON.stringify(bookData)
            });
            const result = await response.json();

            if (!response.ok) {
                throw new Error(result.message || "Помилка при додаванні");
            }

            alert(result.message);
            location.reload();
        } catch (error) {
            alert(error instanceof Error ? error.message : "Помилка при додаванні");
        }
    });
</script>
    <main class="container">
        <div class="catalog-grid">
            <!-- BOOKS -->
        </div>
    </main>

    <footer>
        <p>&copy; 2026 Публічна бібліотека мопсів. Усі права захищені нашою сильною любов'ю та солоденьким храпом. 🐶</p>
    </footer>

</body>
</html>
